[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchops-agent"
version = "0.2.0"
description = "A controlled scientific data analysis agent, built incrementally."
requires-python = ">=3.11"
dependencies = [
  "certifi==2026.7.22",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "matplotlib>=3.8,<4.0",
  "openai-agents[litellm]>=0.21,<0.22",
  "litellm==1.83.0",
  "pandas>=2.0,<4.0",
  "scipy>=1.11,<2.0",
  "statsmodels>=0.14,<1.0",
]

[project.scripts]
researchops = "researchops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
