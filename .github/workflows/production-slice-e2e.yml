name: production-slice-e2e

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "pyproject.toml"
      - "src/**"
      - "services/production_slice/**"
      - ".github/workflows/production-slice-e2e.yml"
  pull_request:
    paths:
      - ".dockerignore"
      - "pyproject.toml"
      - "src/**"
      - "services/production_slice/**"
      - ".github/workflows/production-slice-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-slice-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/production_slice/requirements.lock

      - name: Verify Docker and Compose
        shell: pwsh
        run: |
          docker version
          docker compose version
          docker info --format '{{.ServerVersion}}'

      - name: Install independent service test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/production_slice/requirements.lock
          python -m pip install --no-deps -e services/production_slice
          python -m pip check

      - name: Generate ephemeral CI secrets and synthetic registry
        shell: pwsh
        run: |
          & ./services/production_slice/scripts/bootstrap-ci.ps1

      - name: Run production slice contract tests
        shell: pwsh
        run: |
          python -m pytest services/production_slice/tests -q -p no:cacheprovider `
            --basetemp=artifacts/ci_pytest_tmp

      - name: Validate Compose without printing configuration
        shell: pwsh
        run: |
          docker compose -f services/production_slice/compose.yaml config --quiet

      - name: Run real PostgreSQL MinIO OTel E2E
        id: e2e
        continue-on-error: true
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./services/production_slice/scripts/run-e2e.ps1 `
            -TimeoutSeconds 300
          $code = $LASTEXITCODE
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          if ($code -ne 0) {
            exit $code
          }

      - name: Upload sanitized E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-slice-e2e-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/production_slice/e2e/**

      - name: Stop Compose without deleting volumes
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          docker compose -f services/production_slice/compose.yaml down

      - name: Enforce E2E result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.e2e.outcome }}" -ne "success") {
            throw "Production slice E2E failed; inspect the sanitized artifact."
          }
