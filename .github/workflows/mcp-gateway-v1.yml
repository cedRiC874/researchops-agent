name: mcp-gateway-v1

on:
  push:
    paths: ["services/mcp_gateway_v1/**", "evals/mcp_injection_v1/**", ".github/workflows/mcp-gateway-v1.yml", "src/researchops/**"]
  pull_request:
    paths: ["services/mcp_gateway_v1/**", "evals/mcp_injection_v1/**", ".github/workflows/mcp-gateway-v1.yml", "src/researchops/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-gateway:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/mcp_gateway_v1/requirements.lock
      - name: 安装独立服务的精确锁定依赖
        run: |
          python -m pip install -r services/mcp_gateway_v1/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e services/mcp_gateway_v1
          python -m pip check
      - name: 运行禁止网络的网关与注入回归
        run: python services/mcp_gateway_v1/scripts/run_tests.py
