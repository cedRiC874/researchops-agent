name: item6-experiment-bridge-offline
on:
  pull_request:
    paths:
      - ".gitattributes"
      - "src/**"
      - "evals/**"
      - "services/agent_workflow_comparison_v1/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.lock"
      - "requirements.linux.lock"
      - "pyproject.toml"
      - "probe_out_v3.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/item6-controlled-comparison.yml"
      - ".github/workflows/item6-experiment-bridge-offline.yml"
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - "src/**"
      - "evals/**"
      - "services/agent_workflow_comparison_v1/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.lock"
      - "requirements.linux.lock"
      - "pyproject.toml"
      - "probe_out_v3.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/item6-controlled-comparison.yml"
      - ".github/workflows/item6-experiment-bridge-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-offline:
    runs-on: windows-2022
    # Outer test budget includes many isolated real source/store processes, not a runtime SLA.
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          exit $LASTEXITCODE
      - name: Verify actual checkout before deriving fixtures
        env:
          ITEM6_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/src;$env:GITHUB_WORKSPACE"
          @'
          """Exact checkout gate, embedded unchanged in the proposed narrow workflow."""
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          
          
          def require_exact_git_blob(blob, oid):
              # This is raw-byte validation, not a CRLF/LF normalization allowance.
              actual=hashlib.sha1(b'blob '+str(len(blob)).encode()+b'\0'+blob).hexdigest()
              if actual!=oid:raise ValueError('git_blob')
          
          
          def main():
              record=dict(status='failed',stage='bootstrap',expected_head=None,actual_head=None,tree=None,git_reads=[],
                          source_integrity_only=True,online_execution_authorized=False,tests_executed=False)
              destination=None
              def digest(data):return hashlib.sha256(data).hexdigest()
              def git(root,*args):
                  env={k:os.environ[k] for k in ('PATH','SystemRoot','WINDIR','TEMP','TMP','COMSPEC','PATHEXT') if k in os.environ}
                  env.update(GIT_CONFIG_GLOBAL=os.devnull,GIT_CONFIG_NOSYSTEM='1',GIT_TERMINAL_PROMPT='0',GIT_NO_LAZY_FETCH='1')
                  start=time.monotonic();code=None;outcome='start_failed';stderr=None
                  try:
                      result=subprocess.run(['git','--no-optional-locks',*args],cwd=root,env=env,capture_output=True,timeout=120)
                      code=result.returncode;stderr=result.stderr;outcome='returned'
                      if code!=0:raise RuntimeError('git_nonzero')
                      return result.stdout
                  except subprocess.TimeoutExpired:
                      outcome='timed_out';raise RuntimeError('git_timeout') from None
                  finally:
                      # No command content, exception body, stderr text or environment values.
                      record['git_reads'].append(dict(operation=args[0],outcome=outcome,actual_exit_code=code,
                          elapsed_seconds=time.monotonic()-start,stderr_bytes=None if stderr is None else len(stderr),
                          stderr_sha256=None if stderr is None else digest(stderr)))
              try:
                  root=Path(os.environ['GITHUB_WORKSPACE']).absolute()
                  expected=os.environ['ITEM6_EXPECTED_HEAD'];rid=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT']
                  if re.fullmatch(r'[0-9a-f]{40}',expected) is None or not rid.isdigit() or not attempt.isdigit():raise ValueError('identity')
                  folder=root/'output/item6-checkout-source'/('CI-'+rid+'-'+attempt)
                  folder.mkdir(parents=True,exist_ok=False);destination=folder/'checkout-source.json'
                  if Path.cwd()!=root:raise ValueError('cwd')
                  record.update(stage='identity',expected_head=expected)
                  actual=git(root,'rev-parse','HEAD').decode().strip();tree=git(root,'rev-parse','HEAD^{tree}').decode().strip()
                  record.update(actual_head=actual,tree=tree)
                  if actual!=expected or git(root,'status','--porcelain','--untracked-files=normal').strip():raise ValueError('checkout_identity')
                  record['stage']='git_bytes';count=0
                  for item in git(root,'ls-tree','-r','-z',actual).split(b'\0'):
                      if not item:continue
                      meta,name=item.split(b'\t',1);mode,kind,oid=meta.split();path=root/name.decode('utf-8')
                      if mode not in (b'100644',b'100755') or kind!=b'blob' or not path.is_file() or path.is_symlink() or path.is_junction():raise ValueError('git_file')
                      blob=path.read_bytes()
                      require_exact_git_blob(blob,oid.decode())
                      count+=1
                  record['tracked_files_verified']=count
                  record['stage']='source'
                  sys.path.insert(0,str(root/'src'))
                  from researchops_internal_telemetry import source_integrity_v3 as source
                  if Path(source.__file__).resolve()!=root/'src/researchops_internal_telemetry/source_integrity_v3.py':raise ValueError('source_import')
                  manifest=source.verify_source(root,expected='3d9c83b06b7f1ab0fbed6ac722ca1c45faaa66cb08e2561868e9fb37aae65592')
                  manifest_sha=digest((root/source.MANIFEST).read_bytes())
                  if manifest_sha!='15b303b6aaf97938bf2b6775fd55c2217edfca8ef03e59208ebfd02bfa9c8637':raise ValueError('manifest_sha')
                  record.update(status='valid',stage='complete',source_commitment_sha256=manifest['commitment_sha256'],
                                manifest_sha256=manifest_sha,source_file_count=len(manifest['files']))
                  code=0
              except BaseException:
                  code=1
              record['intended_exit_code']=code
              try:
                  if destination is not None:
                      with destination.open('xb') as f:
                          data=(json.dumps(record,sort_keys=True)+'\n').encode();f.write(data);f.flush();os.fsync(f.fileno())
                  sys.stdout.write(json.dumps(record)+'\n');sys.stdout.flush()
              except BaseException:return 2
              return code
          
          
          if __name__=='__main__':sys.exit(main())
          '@ | python -B -X utf8 -
          exit $LASTEXITCODE
      - name: Run only bridge and affected checks
        id: bridge_tests
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/src;$env:GITHUB_WORKSPACE"
          python -B -X utf8 -m tests.item6_experiment_fixture suite "CI-${{ github.run_id }}-${{ github.run_attempt }}"
          exit $LASTEXITCODE
      - name: Preserve bounded partial progress after bridge failure
        if: always() && steps.bridge_tests.outcome == 'failure'
        timeout-minutes: 2
        env:
          ITEM6_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/src;$env:GITHUB_WORKSPACE"
          @'
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          MODULES = ('tests.test_item6_interface_v2', 'tests.test_item6_privacy_diagnostics', 'tests.test_item6_refusal_isolation', 'tests.test_item6_case_isolation', 'tests.test_item6_experiment_authority', 'tests.test_item6_experiment_session', 'tests.test_item6_experiment_budget', 'tests.test_item6_experiment_artifacts', 'tests.test_item6_experiment_integration', 'tests.test_internal_source_integrity_v3', 'tests.test_phase6_providers', 'tests.test_phase6_provider_completion_capture', 'tests.test_provider_completion_surface_mapping', 'tests.test_completion_telemetry_ledger', 'tests.test_completion_timed_ledger', 'tests.test_internal_source_integrity_v2', 'tests.test_deepseek_completion_first_live_validation', 'tests.test_kimi_k3_handshake', 'tests.test_phase6_depth60')


          def project_progress(raw, allowed):
              header = re.compile(r'^([A-Za-z_][A-Za-z0-9_]*) \(([A-Za-z_][A-Za-z0-9_.]*)\)(?: \.\.\. ?(.*))?$')
              pending = last_observed = last_completed = None
              completed = []
              for line in raw.decode('utf-8', errors='replace').splitlines():
                  match = header.fullmatch(line)
                  tail = None
                  if match:
                      method, test_id, tail = match.groups()
                      pending = None
                      if test_id not in allowed or method != test_id.rsplit('.', 1)[-1]:
                          continue
                      pending = last_observed = test_id
                  elif pending is not None:
                      tail = line
                  if tail in ('ok', 'FAIL', 'ERROR'):
                      outcome = tail
                  elif tail is not None and re.match(r"^skipped (?:'|\")", tail):
                      outcome = 'skipped'
                  else:
                      continue
                  if pending is not None:
                      completed.append(dict(test_id=pending, status=outcome))
                      last_completed, pending = pending, None
                      if len(completed) > 2048:
                          raise ValueError('bounded_observations')
              return dict(schema='item6-bridge-progress/1', partial=True,
                  full_suite_verified=False, failure_cause_verified=False,
                  observation_kind='unittest_text_only',
                  last_observed_test_id=last_observed,
                  last_completed_test_id=last_completed, completed_observations=completed)


          def checkout_identity(raw, run_id, attempt, expected_head):
              if (not re.fullmatch(r'[0-9]{1,24}', run_id)
                      or not re.fullmatch(r'[0-9]{1,8}', attempt)
                      or not re.fullmatch(r'[0-9a-f]{40}', expected_head)):
                  raise ValueError('identity')
              receipt = json.loads(raw)
              if (type(receipt) is not dict or receipt.get('status') != 'valid'
                      or receipt.get('stage') != 'complete'
                      or type(receipt.get('intended_exit_code')) is not int
                      or receipt['intended_exit_code'] != 0
                      or receipt.get('expected_head') != expected_head
                      or receipt.get('actual_head') != expected_head):
                  raise ValueError('checkout_receipt')
              return dict(run_id=run_id, run_attempt=attempt, verified_head=expected_head,
                  identity_evidence_kind='existing_exact_checkout_receipt',
                  checkout_evidence_sha256=hashlib.sha256(raw).hexdigest())


          def main():
              root = Path(os.environ['GITHUB_WORKSPACE']).absolute()
              if Path.cwd() != root:
                  raise ValueError('workspace')
              def directory(path):
                  metadata = path.lstat()
                  if (not stat.S_ISDIR(metadata.st_mode) or path.is_symlink()
                          or getattr(metadata, 'st_file_attributes', 0) & 0x400):
                      raise ValueError('directory')
              directory(root)
              run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
              if not re.fullmatch(r'[0-9]{1,24}', run_id) or not re.fullmatch(r'[0-9]{1,8}', attempt):
                  raise ValueError('identity')
              target = root
              for part in ('output', 'item6-bridge-validation', 'CI-' + run_id + '-' + attempt):
                  target = target / part
                  directory(target)
              public = target / 'public'
              if public.exists():
                  directory(public)
                  if (public / 'validation.json').exists():
                      return 0
              directory(root / 'src')
              directory(root / 'src/researchops_external_closure')
              directory(root / 'tests')
              sys.path.insert(0, str(root / 'src'))
              from researchops_external_closure.io import read_regular_file_no_follow, scan_public_artifact_bytes
              checkout = root
              for part in ('output', 'item6-checkout-source', 'CI-' + run_id + '-' + attempt):
                  checkout = checkout / part
                  directory(checkout)
              receipt = read_regular_file_no_follow(checkout / 'checkout-source.json', max_bytes=1024*1024)
              identity = checkout_identity(receipt, run_id, attempt, os.environ['ITEM6_EXPECTED_HEAD'])
              fixture = ast.parse(read_regular_file_no_follow(root / 'tests/item6_experiment_fixture.py', max_bytes=1024*1024))
              selections = {node.targets[0].id: ast.literal_eval(node.value)
                  for node in fixture.body if isinstance(node, ast.Assign)
                  and isinstance(node.targets[0], ast.Name)
                  and node.targets[0].id in ('NEW_TESTS', 'RELATED_TESTS')}
              if selections['NEW_TESTS'] + selections['RELATED_TESTS'] != MODULES:
                  raise ValueError('scope')
              allowed = set()
              for module in MODULES:
                  source = ast.parse(read_regular_file_no_follow(root / (module.replace('.', '/') + '.py'), max_bytes=1024*1024))
                  for cls in source.body:
                      if not isinstance(cls, ast.ClassDef):
                          continue
                      if not any(isinstance(base, ast.Attribute) and isinstance(base.value, ast.Name)
                          and base.value.id == 'unittest' and base.attr in ('TestCase', 'IsolatedAsyncioTestCase')
                          for base in cls.bases):
                          continue
                      for method in cls.body:
                          if (isinstance(method, (ast.FunctionDef, ast.AsyncFunctionDef))
                                  and method.name.startswith('test_')):
                              test_id = module + '.' + cls.name + '.' + method.name
                              if not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_.]{1,511}', test_id):
                                  raise ValueError('test_identifier')
                              allowed.add(test_id)
              if len(allowed) != 455:
                  raise ValueError('scope')
              raw = read_regular_file_no_follow(target / 'process.log', max_bytes=16*1024*1024)
              report = project_progress(raw, allowed)
              report.update(identity)
              encoded = (json.dumps(report, sort_keys=True, ensure_ascii=True) + '\n').encode('utf-8')
              if len(encoded) > 512*1024:
                  raise ValueError('output_bound')
              scan_public_artifact_bytes((encoded,))
              public.mkdir(exist_ok=True)
              directory(public)
              destination = public / 'progress-on-failure.json'
              if destination.exists() or destination.is_symlink():
                  raise ValueError('output_exists')
              staging = target / 'progress-on-failure.json.pending'
              with staging.open('xb') as stream:
                  stream.write(encoded)
                  stream.flush()
                  os.fsync(stream.fileno())
              directory(public)
              staging.rename(destination)
              print('Partial bridge progress saved; full suite remains unverified.')
              return 0


          if __name__ == '__main__':
              try:
                  code = main()
              except Exception:
                  print('Partial bridge progress unavailable; no raw diagnostic content exported.', file=sys.stderr)
                  code = 1
              raise SystemExit(code)
          '@ | python -B -X utf8 -
          exit $LASTEXITCODE
      - name: Retain this isolated attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item6-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/item6-bridge-validation/CI-${{ github.run_id }}-${{ github.run_attempt }}/public/
            output/item6-checkout-source/CI-${{ github.run_id }}-${{ github.run_attempt }}/
          overwrite: false
          if-no-files-found: warn
