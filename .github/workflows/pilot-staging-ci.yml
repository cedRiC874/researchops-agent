name: pilot-staging-ci

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "pyproject.toml"
      - "requirements.lock"
      - "src/**"
      - "evals/v2/**"
      - "docs/EXTERNAL_RESEARCHER_PILOT_PROTOCOL.md"
      - "docs/SUPERVISED_PILOT_*.md"
      - "services/pilot_staging/**"
      - "services/production_slice/requirements*.lock"
      - ".github/workflows/pilot-staging-ci.yml"
  pull_request:
    paths:
      - ".dockerignore"
      - "pyproject.toml"
      - "requirements.lock"
      - "src/**"
      - "evals/v2/**"
      - "docs/EXTERNAL_RESEARCHER_PILOT_PROTOCOL.md"
      - "docs/SUPERVISED_PILOT_*.md"
      - "services/pilot_staging/**"
      - "services/production_slice/requirements*.lock"
      - ".github/workflows/pilot-staging-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-staging-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: researchops_pilot_ci
          POSTGRES_USER: pilot_ci
          POSTGRES_PASSWORD: pilot_ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilot_ci -d researchops_pilot_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/production_slice/requirements.lock
            services/pilot_staging/requirements.provider.lock

      - name: Verify Docker and Compose
        shell: pwsh
        run: |
          docker version
          docker compose version
          docker info --format '{{.ServerVersion}}'

      - name: Install exact offline test dependencies
        shell: pwsh
        run: |
          python -m pip install -r services/production_slice/requirements.lock
          python -m pip install -r services/pilot_staging/requirements.provider.lock
          python -m pip install --no-deps -e .
          python -m pip install --no-deps -e services/pilot_staging
          python -m pip check

      - name: Generate non-provider CI fixtures
        shell: pwsh
        run: |
          & ./services/pilot_staging/scripts/bootstrap-ci.ps1

      - name: Run pilot offline contracts
        shell: pwsh
        run: |
          python -m pytest -q -p no:cacheprovider `
            services/pilot_staging/tests/test_pilot_flow.py `
            services/pilot_staging/tests/test_config_files.py `
            services/pilot_staging/tests/test_candidate_contract.py `
            services/pilot_staging/tests/test_summary_contract.py `
            services/pilot_staging/tests/test_supervised_scripts.py `
            services/pilot_staging/tests/test_ci_workflow.py `
            --basetemp=artifacts/pilot_ci_pytest_tmp

      - name: Run real PostgreSQL migration and lifecycle contract
        shell: pwsh
        env:
          PILOT_TEST_DATABASE_URL: "postgresql+psycopg://pilot_ci:pilot_ci_ephemeral_password@127.0.0.1:5432/researchops_pilot_ci?sslmode=disable"
        run: |
          python -m pytest -q -p no:cacheprovider `
            services/pilot_staging/tests/test_postgres_integration.py `
            --basetemp=artifacts/pilot_ci_postgres_tmp

      - name: Validate Compose without a Provider secret
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath services/pilot_staging/secrets/provider_api_key.txt) {
            throw "CI must not create a Provider API key file."
          }
          docker compose -f services/pilot_staging/compose.yaml config --quiet

      - name: Start offline API stack
        id: compose
        continue-on-error: true
        shell: pwsh
        run: |
          docker compose -f services/pilot_staging/compose.yaml up -d --build `
            postgres migrate api
          if ($LASTEXITCODE -ne 0) {
            docker compose -f services/pilot_staging/compose.yaml logs `
              --no-color --tail 200 migrate api
            throw "Offline pilot Compose startup failed."
          }
          $ready = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            try {
              $response = Invoke-RestMethod -Uri http://127.0.0.1:8090/health/ready `
                -TimeoutSec 3
              if ($response.status -eq "ready") {
                $ready = $true
                break
              }
            }
            catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            throw "Offline pilot API did not become ready."
          }
          $page = Invoke-WebRequest -Uri http://127.0.0.1:8090/pilot `
            -UseBasicParsing -TimeoutSec 5
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch "ResearchOps") {
            throw "Pilot page contract failed."
          }
          if (Test-Path -LiteralPath services/pilot_staging/secrets/provider_api_key.txt) {
            throw "Offline Compose unexpectedly created a Provider key file."
          }

      - name: Stop Compose without deleting volumes
        id: teardown
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          docker compose -f services/pilot_staging/compose.yaml down
          $remaining = docker compose -f services/pilot_staging/compose.yaml ps -a -q
          if ($remaining) {
            throw "Pilot staging Compose resources remain after teardown."
          }

      - name: Enforce Compose result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.compose.outcome }}" -ne "success") {
            throw "Pilot staging offline Compose verification failed."
          }
          if ("${{ steps.teardown.outcome }}" -ne "success") {
            throw "Pilot staging Compose teardown failed."
          }
