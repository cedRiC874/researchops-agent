name: offline-quality-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evaluation:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Evidence IDs bind numerical results. Pin the lowest supported numerical
      # baseline shared by hosted runners so CPU dispatch cannot perturb the
      # final floating-point bits used by the Phase 5 identity hash.
      OPENBLAS_CORETYPE: NEHALEM
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      NPY_DISABLE_CPU_FEATURES: "X86_V3,X86_V4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Verify deterministic numerical baseline
        shell: pwsh
        run: |
          $env:OPENBLAS_VERBOSE = "2"
          $probe = (& python -c "import numpy as np; np.linalg.svd(np.eye(4))" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $probe -notmatch '(?im)^Core:\s*Nehalem\s*$') {
            Write-Output "::error title=phase5_blas_kernel_mismatch::The pinned Nehalem OpenBLAS kernel was not activated."
            exit 1
          }
          Write-Output "OpenBLAS core verified: Nehalem"
          Remove-Item Env:OPENBLAS_VERBOSE

          $env:PYTHONPATH = "src"
          $identity = (& python -c "import json,pandas as pd; from pathlib import Path; from researchops.analysis_tools import run_ancova; from researchops.contracts import ResearchDesign; from researchops.data_quality import profile_csv; p=Path('data/synthetic_trial.csv'); f=pd.read_csv(p,encoding='utf-8-sig',low_memory=False); d=ResearchDesign.from_dict(json.loads(Path('data/synthetic_trial_design.json').read_text(encoding='utf-8'))); print(run_ancova(f,profile_csv(p),d).evidence_id)" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $identity -ne "E-36034128278C") {
            Write-Output "::error title=phase5_numeric_identity_mismatch::The canonical ANCOVA evidence identity was not reproduced."
            exit 1
          }
          Write-Output "Canonical x86-v2 ANCOVA evidence identity verified."

      - name: Validate evaluation contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m researchops.cli eval-validate
          python -m researchops.cli phase6-validate
          python -m researchops.cli phase6-status
          python -m researchops.cli eval-v2-validate
          python -m researchops.cli eval-v2-verify-public-freeze `
            --candidate evals/v2/public_regression_candidate_v3.json `
            --verify-environment
          $anthropic = (python -m researchops.cli phase6-status `
            --provider anthropic | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $anthropic.provider -ne "anthropic" -or
              $anthropic.online_run_status -ne "not_run" -or
              $anthropic.not_run_reason -ne "api_key_missing" -or
              -not $anthropic.sdk.provider_transport_ready -or
              $anthropic.network_calls -ne 0) {
            Write-Output "::error title=anthropic_offline_contract_invalid::Anthropic must be locally ready but remain offline without a key."
            exit 1
          }

      - name: Run unit and integration tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v

      - name: Validate private-holdout custodian kit
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $kit = (python scripts/eval_v2_private_custodian.py verify-kit `
            --project-root . | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $kit.status -ne "valid" -or
              $kit.current_private_request_allowed -or
              $kit.current_private_access_authorized -or
              $kit.non_synthetic_release_supported -or
              $kit.repository_private_content_scan_performed -or
              $kit.repository_private_content_absence_claimed -or
              $kit.network_calls -ne 0) {
            Write-Output "::error title=private_custodian_kit_invalid::The offline kit or current claim boundary is invalid."
            exit 1
          }

          $status = (python scripts/eval_v2_private_custodian.py status `
            --project-root . | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $status.status -ne "not_authorized" -or
              $status.private_request_allowed -or
              $status.private_access_authorized -or
              $status.network_calls -ne 0) {
            Write-Output "::error title=private_campaign_premature_authorization::Current design-only campaign must remain fail-closed."
            exit 1
          }

      - name: Rebuild the 50-task offline evaluation
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m researchops.cli eval-run --output-dir artifacts/ci_phase5
          $evaluationExitCode = $LASTEXITCODE

          python scripts/verify_phase5_artifacts.py artifacts/ci_phase5 `
            --quality-profile phase5-ci-v1
          $verificationExitCode = $LASTEXITCODE

          if ($evaluationExitCode -ne 0 -or $verificationExitCode -ne 0) {
            Write-Output "::error title=phase5_offline_quality_gate_failed::eval_exit=$evaluationExitCode verifier_exit=$verificationExitCode"
            exit 1
          }

      - name: Upload sanitized evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-offline-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/ci_phase5/eval_manifest.json
            artifacts/ci_phase5/eval_report.json
            artifacts/ci_phase5/eval_summary.md
            artifacts/ci_phase5/eval_audit_index.json
