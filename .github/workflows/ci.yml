name: offline-quality-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.linux.lock

      - name: Install locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.linux.lock
          python -m pip check

      - name: Run Linux x86-64 offline demo
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          bash -n scripts/portfolio_demo.sh
          PYTHON_PATH="$(command -v python)" bash scripts/portfolio_demo.sh --output-dir artifacts/ci_linux_x86_demo
          test ! -e handoff.md
          test -f docs/internal/handoff.md

  offline-evaluation:
    runs-on: windows-latest
    # The complete local integration run took 217 minutes (1,958 tests).
    # Include setup/other gates with headroom; no tests are removed or filtered.
    # Revisit with hosted-runner measurements, not an assumption of equal speed.
    timeout-minutes: 360
    env:
      # Evidence IDs bind numerical results. Pin the lowest supported numerical
      # baseline shared by hosted runners so CPU dispatch cannot perturb the
      # final floating-point bits used by the Phase 5 identity hash.
      OPENBLAS_CORETYPE: NEHALEM
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      NPY_DISABLE_CPU_FEATURES: "X86_V3,X86_V4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Historical integrity replay must have the pinned raw objects.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Verify deterministic numerical baseline
        shell: pwsh
        run: |
          $env:OPENBLAS_VERBOSE = "2"
          $probe = (& python -c "import numpy as np; np.linalg.svd(np.eye(4))" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $probe -notmatch '(?im)^Core:\s*Nehalem\s*$') {
            Write-Output "::error title=phase5_blas_kernel_mismatch::The pinned Nehalem OpenBLAS kernel was not activated."
            exit 1
          }
          Write-Output "OpenBLAS core verified: Nehalem"
          Remove-Item Env:OPENBLAS_VERBOSE

          $env:PYTHONPATH = "src"
          $identity = (& python -c "import json,pandas as pd; from pathlib import Path; from researchops.analysis_tools import run_ancova; from researchops.contracts import ResearchDesign; from researchops.data_quality import profile_csv; p=Path('data/synthetic_trial.csv'); f=pd.read_csv(p,encoding='utf-8-sig',low_memory=False); d=ResearchDesign.from_dict(json.loads(Path('data/synthetic_trial_design.json').read_text(encoding='utf-8'))); print(run_ancova(f,profile_csv(p),d).evidence_id)" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $identity -ne "E-36034128278C") {
            Write-Output "::error title=phase5_numeric_identity_mismatch::The canonical ANCOVA evidence identity was not reproduced."
            exit 1
          }
          Write-Output "Canonical x86-v2 ANCOVA evidence identity verified."

      - name: Validate evaluation contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m researchops.cli eval-validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m researchops.cli phase6-validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m researchops.cli phase6-status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $historicalDepth60Path = "evals/phase6_deepseek_depth60_plan.json"
          $historicalDepth60Bytes = (Get-Item $historicalDepth60Path).Length
          $historicalDepth60Sha = (Get-FileHash `
            -Algorithm SHA256 $historicalDepth60Path).Hash.ToLowerInvariant()
          if ($historicalDepth60Bytes -ne 5398 -or
              $historicalDepth60Sha -ne "f5d43283e3506663383359d24736bd3b82a910e45cc092954f94d86a80e6cd20") {
            Write-Output "::error title=historical_depth60_plan_drift::Historical Depth-60 plan bytes must remain unchanged."
            exit 1
          }
          $historicalDepth60V2Path = "evals/phase6_deepseek_depth60_plan_v2.json"
          $historicalDepth60V2Bytes = (Get-Item $historicalDepth60V2Path).Length
          $historicalDepth60V2Sha = (Get-FileHash `
            -Algorithm SHA256 $historicalDepth60V2Path).Hash.ToLowerInvariant()
          if ($historicalDepth60V2Bytes -ne 2170 -or
              $historicalDepth60V2Sha -ne "fc4ca5cc2131efb36d82f1d739f65ad2a026e1c7534f0da9c873942a40c1002f") {
            Write-Output "::error title=historical_depth60_v2_plan_drift::Historical Depth-60 v2 plan bytes must remain unchanged."
            exit 1
          }
          $depth60V3Path = "evals/phase6_deepseek_depth60_plan_v3.json"
          $depth60V3Bytes = (Get-Item $depth60V3Path).Length
          $depth60V3Sha = (Get-FileHash `
            -Algorithm SHA256 $depth60V3Path).Hash.ToLowerInvariant()
          if ($depth60V3Bytes -ne 2850 -or
              $depth60V3Sha -ne "5602f940a8627b9c785a1b785d757119a616050ebbc2e31e9dd26aacf448c05e") {
            Write-Output "::error title=depth60_v3_plan_drift::Depth-60 v3 plan bytes must remain unchanged."
            exit 1
          }
          $depth60V3 = Get-Content -Raw $depth60V3Path | ConvertFrom-Json
          if ($depth60V3.plan_id -ne "phase6-deepseek-depth60-v3" -or
              $depth60V3.plan_commitment_sha256 -ne "979202e96a5304ad1ba73c54e55f0d38f80baedf8278e37ea8535bb5560ce6af" -or
              $depth60V3.authorization_boundary.online_execution_authorized -ne $false) {
            Write-Output "::error title=depth60_v3_history_invalid::Depth-60 v3 historical identity or boundary drifted."
            exit 1
          }
          $depth60V4Path = "evals/phase6_deepseek_depth60_plan_v4.json"
          $depth60V4Bytes = (Get-Item $depth60V4Path).Length
          $depth60V4Sha = (Get-FileHash `
            -Algorithm SHA256 $depth60V4Path).Hash.ToLowerInvariant()
          if ($depth60V4Bytes -ne 3087 -or
              $depth60V4Sha -ne "ae961e069afa9c842c294f7fb6951e0cf3a4ad86dfcdd16cb96a2c264c232956") {
            Write-Output "::error title=depth60_v4_plan_drift::Depth-60 v4 plan bytes must remain unchanged."
            exit 1
          }
          $depth60V4 = Get-Content -Raw $depth60V4Path | ConvertFrom-Json
          if ($depth60V4.plan_id -ne "phase6-deepseek-depth60-v4" -or
              $depth60V4.plan_commitment_sha256 -ne "c36dc0dd0487aa350dc2bd636b45bb494381e0c732c80be7b410be4b9beda612" -or
              $depth60V4.authorization_boundary.online_execution_authorized -ne $false) {
            Write-Output "::error title=depth60_v4_history_invalid::Depth-60 v4 historical identity or boundary drifted."
            exit 1
          }
          $depth60V5Path = "evals/phase6_deepseek_depth60_plan_v5.json"
          $depth60V5Bytes = (Get-Item $depth60V5Path).Length
          $depth60V5Sha = (Get-FileHash `
            -Algorithm SHA256 $depth60V5Path).Hash.ToLowerInvariant()
          if ($depth60V5Bytes -ne 3120 -or
              $depth60V5Sha -ne "ff39dd5a1aa09b7bc92b27f9d800b5d51fbd2fd69c2a599b5bf0f25aed490aae") {
            Write-Output "::error title=depth60_v5_plan_drift::Depth-60 v5 plan bytes must remain unchanged."
            exit 1
          }
          $historyRaw = (& python scripts/verify_pre_v6_integrity.py | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $history = $historyRaw | ConvertFrom-Json
          if ($history.status -ne "valid" -or
              $history.historical_commit -ne "5f6f9cde2f5e7092ddfbd20bed63c3baad0ea1ab" -or
              $history.historical_tree -ne "30ecfd86ac00aecd8b67305a7c6ed2af88eeee10" -or
              $history.legacy_validation_scope -ne "pinned_git_snapshot_only" -or
              $history.current_validation_scope -ne "internal_v3_offline_source_integrity_only" -or
              $history.current_legacy_rejections.depth60_v7 -ne "phase6_depth60_profile_component_drift" -or
              $history.network_calls -ne 0 -or $history.model_calls -ne 0 -or
              $history.provider_key_loaded -ne $false) {
            Write-Output "::error title=historical_integrity_replay_invalid::Frozen contracts must verify against the pinned historical Git tree without Provider calls."
            exit 1
          }
          if ($history.historical_v11_commit -ne "c945d168ee084f82ab690a2f118912bf28956c27" -or
              $history.historical_v11_tree -ne "0ee6bae3a2c56ef1d8c6c9193d9030f1a8573553" -or
              $history.current_legacy_rejections.depth60_v11 -ne "execution_v4_component_drift") {
            throw "Historical v11 identity or current-tree rejection mismatch."
          }
          $historicalV2 = $history.historical_internal_v2
          if ($historicalV2.commit -ne "5605396e165fc5140eba54340d5a9c93f67540dc" -or
              $historicalV2.tree -ne "60a29c8407e55de8ea9b5700fc478f37044d1a49" -or
              $historicalV2.source_commitment_sha256 -ne "0157e921793e0afe5cd897456535c324ccede9b203eb6792375f1d9b7d67e66d" -or
              $historicalV2.manifest_sha256 -ne "072c1a542427e3282bb3072b7db662dfda43fd0a1e8f062a6a1dd9e545f7750e" -or
              $historicalV2.historical_result_revalidated -ne $false) {
            throw "Historical Internal v2 bytes or lineage mismatch."
          }
          $currentInternal = $history.current_internal
          $historicalInternal = $history.historical_internal_v1
          if ($historicalInternal.commit -ne "551b9e252670be871ff75b0638b033b07d3c6f08" -or
              $historicalInternal.tree -ne "fa18ea712732425a0ed035439a97b93ee08e78ce" -or
              $historicalInternal.source_commitment_sha256 -ne "02ef0f6b776e896f09704608867bdf1d91a7bd6fc09444c57bee6cad0d4cb17c" -or
              $historicalInternal.manifest_sha256 -ne "671a625a1092db071dfa01bc43bed29114d3fcef46a1d54a2ac1483eba0ab0d8" -or
              $historicalInternal.verified_git_blob_count -ne 361 -or
              $historicalInternal.historical_result_revalidated -ne $false -or
              $history.current_legacy_rejections.internal_online_v1 -ne "internal_source_drift") {
            throw "Historical Internal v1 identity or strict online-source rejection mismatch."
          }
          if ($currentInternal.status -ne "valid" -or
              $currentInternal.algorithm -ne "internal-current-tree-offline-source-v3" -or
              $currentInternal.source_commitment_sha256 -ne "5de608c843bb09c028bdc872f1f4d5a09599f52d02fcf2e6e32170c4243816d9" -or
              $currentInternal.manifest_sha256 -ne "a1effad5d2c9b06b15b84b7773c9b3367e978980e01e4782e144f7416043213d" -or
              $currentInternal.source_integrity_only -ne $true -or
              $currentInternal.online_execution_authorized -ne $false -or
              $currentInternal.runtime_admission_verified -ne $false -or
              $currentInternal.historical_result_revalidated -ne $false -or
              $currentInternal.network_calls -ne 0 -or $currentInternal.model_calls -ne 0) {
            throw "Current Internal source-only commitment mismatch."
          }
          $historicalV11 = $history.historical_v11
          if ($historicalV11.status -ne "valid" -or
              $historicalV11.plan_id -ne "phase6-deepseek-depth60-v11" -or
              $historicalV11.source_recipe_version -ne 4 -or
              $historicalV11.profile -ne "first_live" -or
              $historicalV11.source_integrity_only -ne $true -or
              $historicalV11.historical_result_revalidated -ne $false -or
              $historicalV11.plan_commitment_sha256 -ne "7ef11c4658967e47a56d92323e6ac118dfaef57ffd699b721bac1e25d0383b8d" -or
              $historicalV11.implementation_commitment_sha256 -ne "b4c384f5cd832f0bcbcfe1effbdf03da799aa4bd9b8f6910619ea575b487a24c" -or
              $historicalV11.online_execution_authorized -ne $false -or
              $historicalV11.runtime_admission_verified -ne $false -or
              $historicalV11.network_calls -ne 0 -or $historicalV11.model_calls -ne 0) {
            Write-Output "::error title=depth60_v11_contract_invalid::Historical v11 must match its original raw Git checkpoint."
            exit 1
          }
          $depth60 = $history.depth60_v5
          if ($depth60.status -ne "valid" -or
              $depth60.plan_commitment_sha256 -ne "8a5474db1e9ad59d501bf109d4a7ecbf616f40599763a20188581e336d379bd7" -or
              $depth60.source_bundle_algorithm -ne "v2" -or
              $depth60.supersedes_plan_id -ne "phase6-deepseek-depth60-v4" -or
              $depth60.online_execution_authorized -ne $false -or
              $depth60.network_calls -ne 0 -or
              $depth60.model_calls -ne 0) {
            Write-Output "::error title=depth60_v5_contract_invalid::Frozen Depth-60 v5 must verify against its historical snapshot and remain non-executable."
            exit 1
          }
          $depth60Components = $depth60.plan.component_hashes
          if ($depth60Components.source_bundle_sha256 -ne "42ad232ad73792453ff6025d836cd3449d27974a633a1a59a019023d676c64a5" -or
              $depth60Components.completion_telemetry_runtime_bundle_sha256 -ne "606913e5570769e8b5aa430c621c5761d557e747c8b3f82eca67e20540b97acf" -or
              $depth60Components.completion_telemetry_contract_bundle_sha256 -ne "7c2bcfba1d7f6d2195ec389c7f98e1ef6e2ef400c6d7101292f6bbc77942bc15") {
            Write-Output "::error title=depth60_v5_component_drift::Depth-60 v5 source or telemetry component drifted."
            exit 1
          }
          # This status describes the frozen 5f6f9cde tree, not current Internal code.
          $firstLive = $history.first_live
          if ($firstLive.status -ne "offline_implemented_requires_fresh_authorization" -or
              $firstLive.contract_commitment_sha256 -ne "ddff10f30031faf77d6417dd695dd61dae4c6a45334efae7388ab4f2adc4a5bc" -or
              $firstLive.implementation_commitment_sha256 -ne "187bb6b537f2bdffb4bf77581550ea0ca81d02fb52d44d110b22a450ae0dce10" -or
              $firstLive.source_integrity_commitment_sha256 -ne "8a5474db1e9ad59d501bf109d4a7ecbf616f40599763a20188581e336d379bd7" -or
              $firstLive.authorization_binding_schema_version -ne "deepseek-first-live-authorization-binding/2.0" -or
              $firstLive.external_authorization_binding_required -ne $true -or
              $firstLive.online_execution_authorized -ne $false -or
              $firstLive.network_calls -ne 0 -or
              $firstLive.model_calls -ne 0 -or
              $firstLive.provider_key_loaded -ne $false) {
            Write-Output "::error title=deepseek_first_live_offline_contract_invalid::First-live control plane must remain offline and non-authorizing."
            exit 1
          }
          python -m researchops.cli eval-v2-validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $historicalV7Raw = (& python -m researchops.cli `
            eval-v2-verify-public-freeze `
            --candidate evals/v2/public_regression_candidate_v7.json | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $historicalV7 = $historicalV7Raw | ConvertFrom-Json
          if ($historicalV7.status -ne "valid" -or
              $historicalV7.historical_snapshot_only -ne $true -or
              $historicalV7.network_calls -ne 0) {
            Write-Output "::error title=historical_v7_contract_invalid::Candidate v7 must remain a valid offline-only historical snapshot."
            exit 1
          }
          $diagnosticV8Raw = (& python -m researchops.cli `
            eval-v2-verify-public-freeze `
            --candidate evals/v2/public_regression_candidate_v8.json | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $diagnosticV8 = $diagnosticV8Raw | ConvertFrom-Json
          if ($diagnosticV8.status -ne "valid" -or
              $diagnosticV8.historical_snapshot_only -ne $true -or
              $diagnosticV8.diagnostic_snapshot_only -ne $true -or
              $diagnosticV8.public_regression_online_authorized -ne $false -or
              $diagnosticV8.controlled_synthetic_pilot_online_authorized -ne $false -or
              $diagnosticV8.network_calls -ne 0) {
            Write-Output "::error title=diagnostic_v8_contract_invalid::Candidate v8 must remain a valid offline historical diagnostic-only snapshot."
            exit 1
          }
          $environmentRaw = (& python -m researchops.cli `
            eval-v2-verify-environment | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $environment = $environmentRaw | ConvertFrom-Json
          if ($environment.status -ne "valid" -or
              $environment.verification_scope -ne "requirements_lock_and_installed_environment_only" -or
              $environment.candidate_verified -ne $false -or
              $environment.historical_snapshot_verified -ne $false -or
              $environment.dependency_lock.environment_verified -ne $true -or
              $environment.dependency_lock.environment_mismatch_count -ne 0 -or
              $environment.network_calls -ne 0) {
            Write-Output "::error title=eval_v2_environment_contract_invalid::The independent dependency environment gate did not pass."
            exit 1
          }
          $nativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $anthropicPreflightRaw = (& python -m researchops.cli `
              anthropic-models-preflight --model claude-sonnet-5 | Out-String)
            $anthropicPreflightExit = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
          }
          if ($anthropicPreflightExit -ne 4) {
            Write-Output "::error title=anthropic_preflight_cli_failed::Unexpected CLI exit code."
            exit 1
          }
          $anthropicPreflight = $anthropicPreflightRaw | ConvertFrom-Json
          if ($anthropicPreflight.status -ne "not_run" -or
              $anthropicPreflight.error_code -ne "anthropic_preflight_confirmation_required" -or
              $anthropicPreflight.network_calls -ne 0 -or
              $anthropicPreflight.model_token_calls -ne 0 -or
              $anthropicPreflight.authorizes_model_run) {
            Write-Output "::error title=anthropic_preflight_contract_invalid::Unconfirmed preflight must remain offline and non-authorizing."
            exit 1
          }
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $kimiPreflightRaw = (& python -m researchops.cli `
              kimi-models-preflight --model kimi-k3 | Out-String)
            $kimiPreflightExit = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
          }
          if ($kimiPreflightExit -ne 4) {
            Write-Output "::error title=kimi_preflight_cli_failed::Unexpected CLI exit code."
            exit 1
          }
          $kimiPreflight = $kimiPreflightRaw | ConvertFrom-Json
          if ($kimiPreflight.status -ne "not_run" -or
              $kimiPreflight.error_code -ne "kimi_preflight_confirmation_required" -or
              $kimiPreflight.network_calls -ne 0 -or
              $kimiPreflight.model_token_calls -ne 0 -or
              $kimiPreflight.authorizes_model_run -or
              $kimiPreflight.authorizes_provider_registration) {
            Write-Output "::error title=kimi_preflight_contract_invalid::Unconfirmed Kimi preflight must remain offline and non-authorizing."
            exit 1
          }
          $kimiHandshake = $history.kimi
          if ($kimiHandshake.status -ne "valid" -or
              $kimiHandshake.plan_commitment_sha256 -ne "8979dfa8b8826afc6e9e44fadc64ed515b767a421ea122d5ffee5ac40c15e7cd" -or
              $kimiHandshake.network_attempts -ne 0 -or
              $kimiHandshake.network_calls -ne 0 -or
              $kimiHandshake.model_calls -ne 0 -or
              $kimiHandshake.key_loaded -ne $false -or
              $kimiHandshake.online_authorized -ne $false) {
            Write-Output "::error title=kimi_k3_handshake_contract_invalid::Kimi K3 handshake must remain valid, offline and non-authorizing."
            exit 1
          }
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $kimiPilotV6Raw = (& python -m researchops.cli `
              kimi-controlled-synthetic-pilot | Out-String)
            $kimiPilotV6Exit = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
          }
          if ($kimiPilotV6Exit -ne 4) {
            Write-Output "::error title=kimi_pilot_v6_cli_failed::Unexpected CLI exit code."
            exit 1
          }
          $kimiPilotV6 = $kimiPilotV6Raw | ConvertFrom-Json
          if ($kimiPilotV6.status -ne "not_run" -or
              $kimiPilotV6.error_code -ne "kimi_pilot_v6_online_permanently_disabled" -or
              $kimiPilotV6.network_attempts -ne 0 -or
              $kimiPilotV6.network_calls -ne 0 -or
              $kimiPilotV6.model_request_count -ne 0 -or
              $kimiPilotV6.key_loader_passed_to_runner -or
              $kimiPilotV6.authorizes_chat -or
              $kimiPilotV6.authorizes_tools -or
              $kimiPilotV6.authorizes_retry -or
              $kimiPilotV6.authorizes_provider_registration -or
              $kimiPilotV6.authorizes_private_evaluation -or
              $kimiPilotV6.authorizes_non_synthetic_data) {
            Write-Output "::error title=kimi_pilot_v6_contract_invalid::Consumed v6 must remain permanently disabled."
            exit 1
          }
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $kimiPilotV7Raw = (& python -m researchops.cli `
              kimi-controlled-synthetic-pilot-v7 | Out-String)
            $kimiPilotV7Exit = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
          }
          if ($kimiPilotV7Exit -ne 4) {
            Write-Output "::error title=kimi_pilot_v7_cli_failed::Unexpected CLI exit code."
            exit 1
          }
          $kimiPilotV7 = $kimiPilotV7Raw | ConvertFrom-Json
          if ($kimiPilotV7.status -ne "not_run" -or
              $kimiPilotV7.error_code -ne "kimi_pilot_v7_online_permanently_disabled" -or
              $kimiPilotV7.contract_id -ne "kimi-controlled-synthetic-pilot-v2" -or
              $kimiPilotV7.network_attempts -ne 0 -or
              $kimiPilotV7.network_calls -ne 0 -or
              $kimiPilotV7.model_request_count -ne 0 -or
              $kimiPilotV7.key_loader_passed_to_runner -or
              $kimiPilotV7.authorizes_chat -or
              $kimiPilotV7.authorizes_tools -or
              $kimiPilotV7.authorizes_retry -or
              $kimiPilotV7.authorizes_provider_registration -or
              $kimiPilotV7.authorizes_private_evaluation -or
              $kimiPilotV7.authorizes_non_synthetic_data) {
            Write-Output "::error title=kimi_pilot_v7_contract_invalid::Consumed v7 must remain permanently disabled."
            exit 1
          }
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $kimiPilotV8Raw = (& python -m researchops.cli `
              kimi-controlled-synthetic-pilot-v8 | Out-String)
            $kimiPilotV8Exit = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
          }
          if ($kimiPilotV8Exit -ne 4) {
            Write-Output "::error title=kimi_pilot_v8_cli_failed::Unexpected CLI exit code."
            exit 1
          }
          $kimiPilotV8 = $kimiPilotV8Raw | ConvertFrom-Json
          if ($kimiPilotV8.status -ne "not_run" -or
              $kimiPilotV8.error_code -ne "kimi_pilot_v8_confirmation_required" -or
              $kimiPilotV8.contract_id -ne "kimi-controlled-synthetic-pilot-v3" -or
              $kimiPilotV8.network_attempts -ne 0 -or
              $kimiPilotV8.network_calls -ne 0 -or
              $kimiPilotV8.model_request_count -ne 0 -or
              $kimiPilotV8.key_loader_passed_to_runner -or
              $kimiPilotV8.authorizes_chat -or
              $kimiPilotV8.authorizes_tools -or
              $kimiPilotV8.authorizes_retry -or
              $kimiPilotV8.authorizes_provider_registration -or
              $kimiPilotV8.authorizes_private_evaluation -or
              $kimiPilotV8.authorizes_non_synthetic_data) {
            Write-Output "::error title=kimi_pilot_v8_contract_invalid::Unconfirmed v8 must remain zero-call and non-authorizing."
            exit 1
          }
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $kimiPilotV8ConfirmedRaw = (& python -m researchops.cli `
              kimi-controlled-synthetic-pilot-v8 --confirm-online | Out-String)
            $kimiPilotV8ConfirmedExit = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
          }
          if ($kimiPilotV8ConfirmedExit -ne 4) {
            Write-Output "::error title=kimi_pilot_v8_confirmed_cli_failed::Unexpected CLI exit code."
            exit 1
          }
          $kimiPilotV8Confirmed = $kimiPilotV8ConfirmedRaw | ConvertFrom-Json
          if ($kimiPilotV8Confirmed.status -ne "not_run" -or
              $kimiPilotV8Confirmed.error_code -ne "kimi_pilot_v8_online_not_authorized" -or
              $kimiPilotV8Confirmed.network_attempts -ne 0 -or
              $kimiPilotV8Confirmed.network_calls -ne 0 -or
              $kimiPilotV8Confirmed.model_request_count -ne 0 -or
              $kimiPilotV8Confirmed.key_loader_passed_to_runner -or
              $kimiPilotV8Confirmed.authorizes_chat -or
              $kimiPilotV8Confirmed.authorizes_tools -or
              $kimiPilotV8Confirmed.authorizes_retry -or
              $kimiPilotV8Confirmed.authorizes_provider_registration -or
              $kimiPilotV8Confirmed.authorizes_private_evaluation -or
              $kimiPilotV8Confirmed.authorizes_non_synthetic_data) {
            Write-Output "::error title=kimi_pilot_v8_confirmed_contract_invalid::Confirmed v8 must remain zero-call and non-authorizing."
            exit 1
          }
          $anthropic = (python -m researchops.cli phase6-status `
            --provider anthropic | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $anthropic.provider -ne "anthropic" -or
              $anthropic.online_run_status -ne "not_run" -or
              $anthropic.not_run_reason -ne "api_key_missing" -or
              -not $anthropic.sdk.provider_transport_ready -or
              $anthropic.network_calls -ne 0) {
            Write-Output "::error title=anthropic_offline_contract_invalid::Anthropic must be locally ready but remain offline without a key."
            exit 1
          }

      - name: Run unit and integration tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -t . -v

      - name: Validate private-holdout custodian kit
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $kit = (python scripts/eval_v2_private_custodian.py verify-kit `
            --project-root . | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $kit.status -ne "valid" -or
              $kit.current_private_request_allowed -or
              $kit.current_private_access_authorized -or
              $kit.non_synthetic_release_supported -or
              $kit.repository_private_content_scan_performed -or
              $kit.repository_private_content_absence_claimed -or
              $kit.network_calls -ne 0) {
            Write-Output "::error title=private_custodian_kit_invalid::The offline kit or current claim boundary is invalid."
            exit 1
          }

          $status = (python scripts/eval_v2_private_custodian.py status `
            --project-root . | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $status.status -ne "not_authorized" -or
              $status.private_request_allowed -or
              $status.private_access_authorized -or
              $status.network_calls -ne 0) {
            Write-Output "::error title=private_campaign_premature_authorization::Current design-only campaign must remain fail-closed."
            exit 1
          }

      - name: Rebuild the 50-task offline evaluation
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m researchops.cli eval-run --output-dir artifacts/ci_phase5
          $evaluationExitCode = $LASTEXITCODE

          python scripts/verify_phase5_artifacts.py artifacts/ci_phase5 `
            --quality-profile phase5-ci-v1
          $verificationExitCode = $LASTEXITCODE

          if ($evaluationExitCode -ne 0 -or $verificationExitCode -ne 0) {
            Write-Output "::error title=phase5_offline_quality_gate_failed::eval_exit=$evaluationExitCode verifier_exit=$verificationExitCode"
            exit 1
          }

      - name: Upload sanitized evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-offline-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/ci_phase5/eval_manifest.json
            artifacts/ci_phase5/eval_report.json
            artifacts/ci_phase5/eval_summary.md
            artifacts/ci_phase5/eval_audit_index.json

  depth60-counterexample-runtime-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up canonical counterexample Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install platform-compatible locked dependencies
        run: |
          grep -v '^pywin32==' requirements.lock > /tmp/researchops-linux.lock
          python -m pip install -r /tmp/researchops-linux.lock
          python -m pip check

      - name: Verify canonical runtime and actual checkout before S10
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          S10_OUTPUT: artifacts/ci_s10
          S10_EXPECTED_COMMIT: ${{ github.sha }}
          S10_TRIGGER_SHA: ${{ github.sha }}
          S10_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          S10_EVENT_NAME: ${{ github.event_name }}
          S10_ONLY: "false"
          S10_EXECUTION_WORKFLOW: .github/workflows/ci.yml
        run: |
          set -euo pipefail
          test ! -e "$S10_OUTPUT"
          mkdir -p "$S10_OUTPUT"
          python - <<'S10_RUNTIME_PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import unicodedata
          
          OUTPUT = Path(os.environ['S10_OUTPUT'])
          INPUTS = (
              '.github/workflows/ci.yml', '.github/workflows/s10-canonical-only.yml', 'requirements.lock',
              'tests/test_phase6_depth60_95pct_counterexample.py',
              'scripts/verify_phase6_depth60_95pct_counterexample.py',
              'docs/evidence/phase6-deepseek-depth60-interpretation-audit-v1/95_percent_lexical_counterexample.json',
          )
          
          def git(*args):
              return subprocess.check_output(['git', *args], timeout=15, text=True).strip()
          
          def runtime_accepted(row):
              return (row['python_patch'] == '3.12.13' and row['unicode_database'] == '15.0.0'
                      and re.fullmatch('[0-9a-f]{40}', row['expected_commit']) is not None
                      and row['checkout_commit'] == row['expected_commit']
                      and re.fullmatch('[0-9a-f]{40}', row['checkout_tree']) is not None
                      and row['tracked_changes'] == ''
                      and row['execution_workflow'] in ('.github/workflows/ci.yml', '.github/workflows/s10-canonical-only.yml')
                      and type(row['s10_only']) is bool
                      and row['s10_only'] == (row['execution_workflow'] == '.github/workflows/s10-canonical-only.yml'))
          
          row = dict(schema='S10-runtime/2', tests_started=False, sys_version=sys.version,
              python_patch='.'.join(map(str, sys.version_info[:3])), unicode_database=unicodedata.unidata_version,
              expected_commit=os.environ['S10_EXPECTED_COMMIT'], checkout_commit=git('rev-parse', 'HEAD'),
              checkout_tree=git('rev-parse', 'HEAD^{tree}'), tracked_changes=git('status', '--porcelain', '--untracked-files=no'),
              trigger_sha=os.environ['S10_TRIGGER_SHA'], event_name=os.environ['S10_EVENT_NAME'],
              pr_head_sha=os.environ['S10_PR_HEAD'],
              s10_only=os.environ['S10_ONLY'] == 'true',
              execution_workflow=os.environ['S10_EXECUTION_WORKFLOW'],
              inputs={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in INPUTS})
          row['accepted'] = runtime_accepted(row)
          with (OUTPUT/'runtime.json').open('x', encoding='utf-8') as stream:
              json.dump(row, stream, ensure_ascii=True, indent=2)
          print(json.dumps(row, ensure_ascii=True))
          if not row['accepted']:
              raise SystemExit('S10_runtime_or_checkout_mismatch; tests not started')
          S10_RUNTIME_PY

      - name: Replay the complete counterexample module once and seal S10 evidence
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          S10_OUTPUT: artifacts/ci_s10
        run: |
          set -euo pipefail
          set +e
          python -m unittest tests.test_phase6_depth60_95pct_counterexample -v > "$S10_OUTPUT/unittest.log" 2>&1
          s10_exit=$?
          set -e
          set -C
          printf '%s\n' "$s10_exit" > "$S10_OUTPUT/process-exit.txt"
          cat "$S10_OUTPUT/unittest.log"
          python - <<'S10_RECEIPT_PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          
          PREFIX = 'tests.test_phase6_depth60_95pct_counterexample.'
          S10 = tuple(PREFIX + 'Phase6Depth6095PercentCounterexampleTests.' + name for name in (
              'test_emit_is_canonical_and_verify_compares_every_value',
              'test_exact_five_locked_tasks_and_complete_traces_are_exercised',
              'test_fresh_process_import_and_build_use_no_provider_or_model_runtime',
              'test_generator_has_zero_network_model_environment_or_key_access',
              'test_generator_is_deterministic_and_retracts_the_false_claims',
              'test_natural_and_letter_prefixed_witnesses_use_the_actual_scorer',
              'test_published_artifact_rejects_current_source_and_verifies_historical_binding',
              'test_runtime_drift_fails_before_scorer_replay',
              'test_same_patch_different_build_string_replays_deterministically',
              'test_source_bytes_hashes_and_ast_lines_are_bound',
          ))
          ROUTING = PREFIX + 'CounterexampleRuntimeRoutingTests.test_ci_routes_counterexample_replay_to_the_canonical_runtime'
          EXPECTED = (ROUTING, *S10)
          
          def summarize(log, exit_code):
              records = []
              for line in log.splitlines():
                  match = re.fullmatch(r'(\S+) \(([^\r\n]+)\) \.\.\. (.+)', line)
                  if match:
                      records.append(dict(display=match[1], id=match[2], outcome=match[3]))
              summaries = re.findall(r'^Ran (\d+) tests? in [^\r\n]+$', log, re.M)
              tests_run = int(summaries[0]) if len(summaries) == 1 else None
              ids = [r['id'] for r in records]
              exact = (ids == list(EXPECTED) and len(set(ids)) == 11
                       and all(r['display'] == r['id'].rsplit('.', 1)[1] for r in records))
              all_ok = exact and all(r['outcome'] == 'ok' for r in records)
              summary_ok = len(re.findall(r'^OK$', log, re.M)) == 1
              detailed_summary = re.search(r'^(?:FAILED|OK) \(([^\r\n]+)\)$', log, re.M)
              metrics = {k: None for k in ('failures', 'errors', 'skips', 'expected_failures', 'unexpected_successes')}
              if summary_ok and all_ok and tests_run == 11 and exit_code == 0:
                  metrics = {k: 0 for k in metrics}
              elif detailed_summary is not None:
                  parts = {k.strip():v for k,v in re.findall(r'([a-z ]+)=(\d+)', detailed_summary[1])}
                  if parts and set(parts) <= {'failures','errors','skipped','expected failures','unexpected successes'}:
                      for key, label in (('failures','failures'),('errors','errors'),('skips','skipped'),
                                         ('expected_failures','expected failures'),('unexpected_successes','unexpected successes')):
                          metrics[key] = int(parts.get(label, '0'))
              # Class-level skips may have exit 0; do not turn that into ten passes.
              passed_ids = {r['id'] for r in records if r['outcome'] == 'ok'}
              skipped_ids = {r['id'] for r in records if r['outcome'].startswith('skipped')}
              return dict(planned_s10=10, planned_routing=1, planned_total=11,
                  tests=tests_run, actual_test_process_exit_code=exit_code, records=records,
                  s10_passed=sum(i in passed_ids for i in S10), routing_passed=int(ROUTING in passed_ids),
                  observed_skipped_ids=sorted(skipped_ids), missing_expected_ids=[i for i in EXPECTED if i not in ids],
                  exact_order_and_unique_ids=exact, all_tests_passed_without_skips=bool(exit_code == 0 and tests_run == 11 and all_ok and summary_ok),
                  **metrics)
          
          OUTPUT = Path(os.environ['S10_OUTPUT'])
          raw = (OUTPUT/'unittest.log').read_bytes()
          if len(raw) > 16777216:
              raise SystemExit('S10_log_size_limit')
          exit_text = (OUTPUT/'process-exit.txt').read_text(encoding='ascii').strip()
          if re.fullmatch('[0-9]{1,3}', exit_text) is None:
              raise SystemExit('S10_process_exit_missing')
          row = summarize(raw.decode('utf-8').replace('\r\n', '\n'), int(exit_text))
          runtime = json.loads((OUTPUT/'runtime.json').read_text(encoding='utf-8'))
          after = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in runtime['inputs']}
          actual_head = subprocess.check_output(['git','rev-parse','HEAD'], timeout=15, text=True).strip()
          dirty = subprocess.check_output(['git','status','--porcelain','--untracked-files=no'], timeout=15, text=True).strip()
          stable = after == runtime['inputs'] and actual_head == runtime['checkout_commit'] and dirty == ''
          row.update(schema='S10-canonical-CI/2', runtime=runtime, inputs_after=after, inputs_stable=stable,
              unittest_log_sha256=hashlib.sha256(raw).hexdigest(), root_full=False,
              status='passed' if runtime['accepted'] and stable and row['all_tests_passed_without_skips'] else 'failed')
          with (OUTPUT/'result.json').open('x', encoding='utf-8') as stream:
              json.dump(row, stream, ensure_ascii=True, indent=2)
          print(json.dumps({k:v for k,v in row.items() if k not in ('records','runtime','inputs_after')}, ensure_ascii=True))
          if row['status'] != 'passed':
              raise SystemExit(1)
          S10_RECEIPT_PY
          exit "$s10_exit"

      - name: Preserve S10 evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: s10-root-canonical-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci_s10
          if-no-files-found: error
          retention-days: 14
