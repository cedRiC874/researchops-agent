<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Depth-60 rejection-reason histogram</title>
  <desc id="desc">Mechanical first failed gate for 40 frozen failures, plus a delivery-aware split. Two plain-gate and mixed-missing rows are byte-empty delivery failures; one assertion-inventory row is a sanitized projection.</desc>
  <defs>
    <style>
      .title { font: 700 28px system-ui, sans-serif; fill: #172033; }
      .subtitle { font: 400 15px system-ui, sans-serif; fill: #536179; }
      .panel-title { font: 700 19px system-ui, sans-serif; fill: #172033; }
      .label { font: 500 15px system-ui, sans-serif; fill: #24324a; }
      .value { font: 700 15px system-ui, sans-serif; fill: #172033; }
      .note { font: 400 13px system-ui, sans-serif; fill: #637087; }
      .axis { stroke: #c9d2e3; stroke-width: 1; }
      .grid { stroke: #e8edf5; stroke-width: 1; }
    </style>
    <pattern id="unresolved" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f0a23b"/>
      <rect width="3" height="8" fill="#fff2d8"/>
    </pattern>
    <pattern id="byteEmpty" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#67748a"/>
      <rect width="3" height="8" fill="#dce2ea"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="48" y="52" class="title">DeepSeek Depth-60 rejection reasons</text>
  <text x="48" y="78" class="subtitle">Post-hoc deterministic projection of the frozen 40 failures — no rescore, no Provider call</text>

  <rect x="36" y="103" width="1128" height="367" rx="12" fill="#f8fafd" stroke="#dfe6f1"/>
  <text x="58" y="137" class="panel-title">First failed gate (mutually exclusive, n=40)</text>
  <text x="58" y="161" class="note">Bars follow the locked scorer's short-circuit order. Counts sum to 40.</text>

  <line x1="340" y1="181" x2="340" y2="437" class="axis"/>
  <line x1="530" y1="181" x2="530" y2="437" class="grid"/>
  <line x1="720" y1="181" x2="720" y2="437" class="grid"/>
  <line x1="910" y1="181" x2="910" y2="437" class="grid"/>
  <line x1="1100" y1="181" x2="1100" y2="437" class="grid"/>
  <text x="340" y="455" text-anchor="middle" class="note">0</text>
  <text x="530" y="455" text-anchor="middle" class="note">5</text>
  <text x="720" y="455" text-anchor="middle" class="note">10</text>
  <text x="910" y="455" text-anchor="middle" class="note">15</text>
  <text x="1100" y="455" text-anchor="middle" class="note">20 tasks</text>

  <g data-gate="assertion_inventory_rejected" data-count="20" data-byte-exact-count="19" data-sanitized-only-count="1">
    <text x="320" y="207" text-anchor="end" class="label">Assertion inventory rejected</text>
    <rect x="340" y="188" width="722" height="25" rx="4" fill="#3d78c5"/>
    <rect x="1062" y="188" width="38" height="25" rx="4" fill="url(#unresolved)"/>
    <text x="1112" y="207" class="value">20</text>
  </g>
  <g data-gate="numeric_literal_in_non_claim_prose" data-count="12">
    <text x="320" y="249" text-anchor="end" class="label">Numeric literal in non-CLAIM prose</text>
    <rect x="340" y="230" width="456" height="25" rx="4" fill="#3d78c5"/>
    <text x="808" y="249" class="value">12</text>
  </g>
  <g data-gate="nonstructured_required_phrase_short_circuit" data-count="3" data-content-bearing-count="1" data-byte-empty-count="2">
    <text x="320" y="291" text-anchor="end" class="label">Plain required phrase missing</text>
    <rect x="340" y="272" width="38" height="25" rx="4" fill="#3d78c5"/>
    <rect x="378" y="272" width="76" height="25" rx="4" fill="url(#byteEmpty)"/>
    <text x="466" y="291" class="value">3</text>
  </g>
  <g data-gate="assignment_label_repeated_in_prose" data-count="2">
    <text x="320" y="333" text-anchor="end" class="label">Assignment label repeated in prose</text>
    <rect x="340" y="314" width="76" height="25" rx="4" fill="#3d78c5"/>
    <text x="428" y="333" class="value">2</text>
  </g>
  <g data-gate="enum_value_repeated_in_prose" data-count="2">
    <text x="320" y="375" text-anchor="end" class="label">Enum value repeated in prose</text>
    <rect x="340" y="356" width="76" height="25" rx="4" fill="#3d78c5"/>
    <text x="428" y="375" class="value">2</text>
  </g>
  <g data-gate="malformed_assert_line" data-count="1">
    <text x="320" y="417" text-anchor="end" class="label">Malformed ASSERT line</text>
    <rect x="340" y="398" width="38" height="25" rx="4" fill="#3d78c5"/>
    <text x="390" y="417" class="value">1</text>
  </g>

  <rect x="36" y="490" width="1128" height="166" rx="12" fill="#f8fafd" stroke="#dfe6f1"/>
  <text x="58" y="524" class="panel-title">Failure scope × required-literal presence (n=40)</text>
  <g data-bucket="phrase_only_all_literals_present_format_rejected" data-count="30">
    <rect x="58" y="548" width="690" height="24" rx="4" fill="#246b5b"/>
    <text x="760" y="566" class="value">30 · phrase-only, all literals present</text>
  </g>
  <g data-bucket="phrase_only_one_or_more_literals_missing" data-count="4">
    <rect x="58" y="580" width="92" height="24" rx="4" fill="#c26a2e"/>
    <text x="162" y="598" class="value">4 · phrase-only, literal missing</text>
  </g>
  <g data-bucket="mixed_all_literals_present_format_rejected" data-count="3">
    <rect x="605" y="580" width="69" height="24" rx="4" fill="#7b66bd"/>
    <text x="686" y="598" class="value">3 · mixed, all literals present</text>
  </g>
  <g data-bucket="mixed_one_or_more_literals_missing" data-count="3" data-content-bearing-count="1" data-byte-empty-count="2">
    <rect x="605" y="612" width="23" height="24" rx="4" fill="#9b718d"/>
    <rect x="628" y="612" width="46" height="24" rx="4" fill="url(#byteEmpty)"/>
    <text x="686" y="630" class="value">3 · mixed, literal missing (2 byte-empty)</text>
  </g>

  <rect x="48" y="669" width="13" height="13" fill="url(#unresolved)" stroke="#d28a2c"/>
  <text x="69" y="680" class="note">P6-DEV-057 is sanitized-projection-only; 39 rows are byte-identical to scorer-input hashes.</text>
  <rect x="48" y="693" width="13" height="13" fill="url(#byteEmpty)" stroke="#67748a"/>
  <text x="69" y="704" class="note">DEV-043/060 are byte-empty delivery failures; their mechanical text gates are non-discriminating.</text>
  <text x="1152" y="704" text-anchor="end" class="note">Locked result remains 20/60.</text>
</svg>
